name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *" # 每小时检查一次上游更新
  workflow_dispatch: # 也可手动触发

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          # merge commit 需要 git 身份，runner 默认没有配置，必须先设置
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/basketikun/infinite-canvas.git
          git fetch upstream main
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse HEAD)
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "Already up to date"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "Merge OK, pushing"
            git push origin main
          else
            echo "Merge conflict — resolve manually in fork"
            git merge --abort || true
            exit 1
          fi
